    <script>
           // alert("hello");
           $(document).ready(function (){
               //alert("hello");
               $.get("http://localhost:8080/userdetails",function (data,status){
                  //alert(data.length); 
                  
                  $("#tabl tbody").empty(); 
				     data.forEach(function (item) { 
				    	 $("#tabl tbody").append('<tr> <td> '+item.userid+' </td> <td> '+item.fullname+' </td> <td> '+item.username+' </td><td> '+item.phone+' </td> <td> '+item.address+' <td> '+item.email+' </td><td> '+item.gender+' </td><td> '+item.language+' </td><td> '+item.dob+' </td><td> '+item.city+' </td><td> '+item.password+' </td><td><button type="button" id="btn" class="getvalues">Edit</button></td><td><button type="button" id="btn" class="getid">Delete</button></td> </tr>'); 	    	
        });  
               });
               
               $(document).on('click', '#tabl .getid', function() {
                   //location.reload();
                   console.log("Delete button clicked!");
                    var row = $(this).closest('tr');
                    var id = row.find('td:eq(0)').text();
                    console.log("ID: " + id); 
                     $.ajax({
                        type: "DELETE",  
                        contentType: "application/json",
                        url: "http://localhost:8080/deleteuser/"+id, 
                        dataType: "text",
                        success: function(data) {
                            location.reload();
                            refreshData();
                        if (data == "deleted") {
                         alert("Data Deleted Successfully");
                     }
                    console.log(data);
                    },
                });
               });
               
                $(document).on('click', '#tabl .getvalues', function() {
                   //location.reload();
                   console.log("Edit button clicked!");
                    var row = $(this).closest('tr');
                    var id = row.find('td:eq(0)').text();
                    console.log("ID: " + id);
                  $.get("http://localhost:8080/edituser/"+id,function(data,status){
                      console.log(data);
                      $("#userid").val(data.userid);
                      $("#fullname").val(data.fullname);
                      $("#username").val(data.username);
                      $("#phone").val(data.phone);
                      $("#address").val(data.address);
                      $("#email").val(data.email);
                      if(data.gender=='male')
                      {
                          $("#gendermale").prop("checked",true);
                          $("#genderfemale").prop("checked",false);
                      }else
                      {
                           $("#gendermale").prop("checked",false);
                          $("#genderfemale").prop("checked",true);
                      }
                      
                      if(data.language=='Hindi')
                      {
                          $("#hindi").prop("checked",true);
                          $("#english").prop("checked",false);
                      }else
                      {
                           $("#hindi").prop("checked",false);
                          $("#english").prop("checked",true);
                      }
                      
                       $("#dob").val(data.dob);
                       
                      if(data.city=='Nagpur')
                      {
                          $("#city").val('Nagpur');
                      }
                      else if(data.city=='Raipur')
                      {
                           $("#city").val('Raipur');
                      }
                      else if(data.city=='Raigarh')
                      {
                           $("#city").val('Raigarh');
                      }
                      else if(data.city=='Bilaspur')
                      {
                           $("#city").val('Bilaspur');
                      }
                      else if(data.city=='Rajnandgaon')
                      {
                           $("#city").val('Rajnandgaon');
                      }
                      
                      $("#password").val(data.password);
                  });
                   
               });
               
               function refreshData()
               {
                    $.get("http://localhost:8080/userdetails",function (data,status){
                  //alert(data.length); 
                  
                  $("#tabl tbody").empty(); 
                    data.forEach(function (item) { 
                    $("#tabl tbody").append('<tr> <td> '+item.userid+' </td> <td> '+item.fullname+' </td> <td> '+item.username+' </td><td> '+item.phone+' </td> <td> '+item.address+' <td> '+item.email+' </td><td> '+item.gender+' </td><td> '+item.language+' </td><td><button type="button" class="getvalues">Edit</button></td><td><button type="button" class="getid">Delete</button></td> </tr>'); 	    	
                 });  
               });
               }
               
               
               /* Logic For Update*/
               
               
               $("#updateuser").submit(function(event){
                   // alert('test');
                   event.preventDefault();
		 ajaxPost();
	}); 
	
	function ajaxPost()
	{
		var formData = {
                                 userid : $("#userid").val(),
				 fullname : $("#fullname").val(),
				 username : $("#username").val(),
				 phone : $("#phone").val(),
				 address : $("#address").val(),
				 email : $("#email").val(),
                                 gender: $("input[name='gender']:checked").val(),
                               
				 language: $("input[name='language']:checked").val(),
                               
				dob : $("#dob").val(),
				city: $("#city").val(),
				password : $("#password").val()
				}
                                console.log(formData);
		
		//Do Post
                   $.ajax({
			type : "post",
			contentType:"application/json",
			url:"http://localhost:8080/userupdate" ,
			data:JSON.stringify(formData) , 
			datatype:"application/text",
			success:function(data)
			{
                             location.reload();
                            refreshData();
				if(data=="success")
					{
                                            alert("Data Updated Success Successfully");
					}
                                    console.log(data);
			},
		});
                
                
		//ajaxPost();
	}
               
               
           });
        
    </script>
