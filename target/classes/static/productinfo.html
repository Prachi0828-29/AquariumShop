<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>
body{
    background:#f4fbff;
    font-family:'Poppins', sans-serif;
}

.details-card{
    max-width:600px;
    background:#fff;
    margin:60px auto;
    padding:25px;
    border-radius:18px;
    box-shadow:0 20px 40px rgba(0,0,0,0.15);
    text-align:center;
}

.details-card img{
    width:100%;
    height:300px;
    object-fit:cover;
    border-radius:15px;
}

.price{
    color:#008c9e;
    font-size:20px;
    font-weight:600;
    margin:15px 0;
}

.back-btn{
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:linear-gradient(to right,#00c6ff,#00f2c3);
    font-weight:600;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="details-card">
    <img id="pimg">
    <h2 id="pname"></h2>
    <div class="price" id="pprice"></div>

    <p>
        Healthy, premium-quality aquarium fish.
        Ideal for home & professional tanks.
    </p>

    <button class="back-btn" onclick="history.back()">⬅ Back</button>
</div>

<script>
$(document).ready(function(){

    let product = JSON.parse(localStorage.getItem("selectedProduct"));

    if(product){
        $("#pname").text(product.name);
        $("#pprice").text("From " + product.price);
        $("#pimg").attr("src", product.img);
    }

});
</script>

</body>
</html>
