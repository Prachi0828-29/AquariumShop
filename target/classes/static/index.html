<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AquaShop Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

/* BACKGROUND */
body{
    min-height:100vh;
    background:
      linear-gradient(135deg, rgba(0,40,80,0.9), rgba(0,180,200,0.9)),
      url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e");
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* GLASS CARD */
.login-card{
    width:380px;
    background:rgba(255,255,255,0.18);
    backdrop-filter: blur(14px);
    padding:40px 35px;
    border-radius:18px;
    box-shadow:0 30px 60px rgba(0,0,0,0.35);
    color:#fff;
}

/* LOGO / TITLE */
.login-card h2{
    text-align:center;
    font-weight:600;
    margin-bottom:5px;
}

.login-card p{
    text-align:center;
    font-size:13px;
    margin-bottom:30px;
    opacity:0.9;
}

/* INPUT */
.form-group{
    margin-bottom:18px;
}

.form-group input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    outline:none;
    background:rgba(255,255,255,0.9);
    font-size:14px;
}

/* PASSWORD */
.password-box{
    position:relative;
}

.password-box span{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:18px;
}

/* BUTTON */
.btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:12px;
    background:linear-gradient(to right,#00c6ff,#00f2c3);
    color:#003;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    margin-top:10px;
    transition:0.3s;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

/* FOOTER */
.footer{
    margin-top:20px;
    text-align:center;
    font-size:13px;
}

.footer a{
    color:#aefbff;
    text-decoration:none;
    font-weight:500;
}
</style>
</head>

<body>

<div class="login-card">
    <h2>🐠 Saanvi Fish House</h2>
    <p>Premium Aquarium Shop Login</p>

    <form id="loginForm">
        <div class="form-group">
            <input type="email" name="email" id="email" placeholder="Email address" required>
        </div>

        <div class="form-group password-box">
            <input type="password"Name="password" id="password" placeholder="Password" required>
            <span id="togglePassword">🙊</span>
        </div>

        <button class="btn">LOGIN</button>
    </form>

    <div class="footer">
        New customer? <a href="register.html">Create account</a>
    </div>
</div>

<script>
const togglePassword = document.getElementById("togglePassword");
const passwordField = document.getElementById("password");

togglePassword.addEventListener("click", () => {
    if(passwordField.type === "password"){
        passwordField.type = "text";
        togglePassword.textContent = "🙈";
    } else {
        passwordField.type = "password";
        togglePassword.textContent = "🙊";
    }
});
</script>

       });
  
  
      </script>
</body>
</html>
